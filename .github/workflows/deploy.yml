name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; a newer push waits in the queue (only a still-pending run is replaced)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version check needs the commit that was on main before this push
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A failing test or a version that was not raised stops the deploy: the site keeps its current version
      - name: Unit tests
        run: npm test
      - name: Version was raised
        # Pushes only: a manual run redeploys what is already on main
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-version.mjs --base "$BASE_SHA"
      - run: npm run build
        env:
          VITE_BASE: /vagmarken-quest/
      # Single-page fallback so deep links don't hit GitHub's 404 page
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
